
{{ define "main" }}

<main class="post h-entry container row">
  <div class="post">
<!--
    <header class="company-header">
      {{ with .Params.logo }}
        <img src="{{ . }}" alt="Firmenlogo" class="company-logo">
      {{ end }}

      <h1 class="company-title">{{ .Title }}</h1>
    </header>
    -->

    <div class="e-content">
      {{ .Content }}

      {{ with .Params.tags }}
        <span class="tag-container">
          {{ range . }}
            <a class="p-category tag" href="{{ "tags/" | relURL }}{{ . | urlize }}/">
              {{ . }}
            </a>
          {{ end }}
        </span>
      {{ end }}
    </div>

  </div>
</main>

<style>
.company-header {
  margin: 20px 0 36px;
}

.company-logo {
  display: block;
  max-width: 260px;
  max-height: 150px;
  width: auto;
  height: auto;
  object-fit: contain;
  margin-bottom: 24px;
}

.company-title {
  font-size: 1.7rem;
  line-height: 1.3;
  font-weight: 600;
  text-align: left;
  margin: 0;
}
</style>

{{ end }}
