{{ $lat := .Get "lat" }}
{{ $lon := .Get "lon" }}

<iframe
  width="100%"
  height="350"
  style="border: 0; border-radius: 8px;"
  loading="lazy"
  title="Firmenstandort"
  src="https://www.openstreetmap.org/export/embed.html?bbox={{ sub (float $lon) 0.01 }},{{ sub (float $lat) 0.005 }},{{ add (float $lon) 0.01 }},{{ add (float $lat) 0.005 }}&marker={{ $lat }},{{ $lon }}">
</iframe>
